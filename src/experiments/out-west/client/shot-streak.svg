<svg xmlns="http://www.w3.org/2000/svg" width="16" height="128" viewBox="0 0 16 128">
  <title>Fading bullet streak</title>
  <defs>
    <linearGradient id="length" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0" />
      <stop offset=".25" stop-color="white" stop-opacity=".25" />
      <stop offset=".8" stop-color="white" stop-opacity="1" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="width">
      <stop stop-color="white" stop-opacity="0" />
      <stop offset=".5" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="feather"><rect width="16" height="128" fill="url(#width)" /></mask>
  </defs>
  <rect width="16" height="128" fill="url(#length)" mask="url(#feather)" />
</svg>
