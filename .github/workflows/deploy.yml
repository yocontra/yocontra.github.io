name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # weekly rebuild to refresh GitHub stats
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Require production config
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: |
          test -n "$PUBLIC_TURNSTILE_SITEKEY" || { echo "Set the TURNSTILE_SITEKEY repository variable"; exit 1; }
      - run: bun run check
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_API_URL: https://api.contra.io
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          PUBLIC_OW_PERF_HARNESS: ""
          PUBLIC_OW_ASSET_REVISION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  api:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit

  deploy:
    needs: [build, api]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
