name: Deploy API

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Refuse a placeholder database id
        run: |
          ! grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' api/wrangler.jsonc || {
            echo "Run 'bun scripts/release.ts' once to create the production D1 database"; exit 1; }
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply contra-leaderboard --config api/wrangler.jsonc --remote
      - name: Deploy the Worker
        run: bunx wrangler deploy --config api/wrangler.jsonc --durable-objects-code-update-mode immediate
